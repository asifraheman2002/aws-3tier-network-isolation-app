<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS 3-Tier Guestbook</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            max-width:700px;
            margin:40px auto;
            padding:20px;
            background:#f5f5f5;
        }

        h2{
            color:#0077cc;
        }

        .card{
            background:#fff;
            padding:20px;
            border-radius:8px;
            box-shadow:0 2px 8px rgba(0,0,0,.1);
        }

        label{
            display:block;
            margin-top:10px;
            font-weight:bold;
        }

        input,textarea{
            width:100%;
            padding:10px;
            margin-top:5px;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        button{
            margin-top:15px;
            padding:10px 20px;
            border:none;
            background:#0077cc;
            color:white;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#005fa3;
        }

        .entry{
            margin-top:15px;
            padding:15px;
            background:white;
            border-left:5px solid #0077cc;
            border-radius:5px;
        }

        small{
            color:gray;
        }
    </style>
</head>

<body>

<h2>📝 AWS 3-Tier Architecture Guestbook</h2>

<p>
Browser ➜ Apache Web Server ➜ Flask App Server ➜ Amazon RDS MySQL
</p>

<div class="card">

<h3>Sign Guestbook</h3>

<label>Name</label>
<input type="text" id="name" placeholder="Enter your name">

<label>Message</label>
<textarea id="message" rows="4" placeholder="Write your message"></textarea>

<button onclick="submitData()">Submit</button>

</div>

<h3>Guestbook Entries</h3>

<div id="guestbook-entries">
Loading...
</div>

<script>

async function fetchEntries(){

    try{

        const response = await fetch("/api/entries");

        const data = await response.json();

        const container = document.getElementById("guestbook-entries");

        container.innerHTML="";

        if(data.length===0){

            container.innerHTML="<p>No Guestbook Entries.</p>";
            return;
        }

        data.forEach(entry=>{

            container.innerHTML += `
            <div class="entry">
                <strong>${escapeHtml(entry.name)}</strong><br>
                ${escapeHtml(entry.message)}
                <br>
                <small>${entry.created_at}</small>
            </div>
            `;

        });

    }

    catch(error){

        document.getElementById("guestbook-entries").innerHTML =
        `<p style="color:red;">${error}</p>`;

    }

}

async function submitData(){

    const name=document.getElementById("name").value;

    const message=document.getElementById("message").value;

    if(!name || !message){

        alert("Please enter Name and Message");

        return;
    }

    const response=await fetch("/api/entries",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            name:name,
            message:message

        })

    });

    if(response.ok){

        document.getElementById("name").value="";

        document.getElementById("message").value="";

        fetchEntries();

    }

    else{

        alert("Unable to save data.");

    }

}

function escapeHtml(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

}

fetchEntries();

</script>

</body>
</html>
